<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
<title>Shiftly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f55d4'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0' fill='none' stroke='%23fff' stroke-opacity='.45' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='16' y1='20' x2='11.5' y2='13.5' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='1.8' fill='%23fff'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky header with five tabs. Weeks are collapsible cards, newest first; the cap meter on each card is the main signal. */
:root{
  --font-display:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#edf0f6; --line:#dde2eb;
  --fg:#131a27; --muted:#586277; --shadow:rgba(19,26,39,.12);
  --accent:#2f55d4; --accent-ink:#ffffff; --accent-soft:#e5ebff;
  --ok:#17703f; --ok-bg:#e1f3e8; --ok-bar:#2f9e65;
  --warn:#7a5000; --warn-bg:#fcefc9; --warn-bar:#e0a100;
  --over:#b42318; --over-bg:#fde6e3; --over-bar:#d64535;
  --hero-a:#2f55d4; --hero-b:#6a46d6; --hero-shadow:rgba(47,85,212,.30);
  --cb-bg:#e5ebff; --cb-fg:#2f55d4; --cv-bg:#efe7ff; --cv-fg:#6b3fd1; --cg-bg:#dcf3e6; --cg-fg:#17703f; --ca-bg:#fdf0d2; --ca-fg:#8a5a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e121a; --surface:#161c27; --surface-2:#1e2633; --line:#2a3446;
    --fg:#e8ecf3; --muted:#98a3b6; --shadow:rgba(0,0,0,.5);
    --accent:#86a0ff; --accent-ink:#0b1226; --accent-soft:#1f2a4d;
    --ok:#62d69c; --ok-bg:#12301f; --ok-bar:#4cc58a;
    --warn:#f2c14e; --warn-bg:#3a2d0a; --warn-bar:#e5ae2b;
    --over:#ff8a7d; --over-bg:#3d1713; --over-bar:#f0685a;
    --hero-a:#2c46ad; --hero-b:#5238ad; --hero-shadow:rgba(0,0,0,.5);
    --cb-bg:#1f2a4d; --cb-fg:#a9bbff; --cv-bg:#2c2150; --cv-fg:#c6b0ff; --cg-bg:#12301f; --cg-fg:#6fdca5; --ca-bg:#3a2d0a; --ca-fg:#f2c14e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e121a; --surface:#161c27; --surface-2:#1e2633; --line:#2a3446;
  --fg:#e8ecf3; --muted:#98a3b6; --shadow:rgba(0,0,0,.5);
  --accent:#86a0ff; --accent-ink:#0b1226; --accent-soft:#1f2a4d;
  --ok:#62d69c; --ok-bg:#12301f; --ok-bar:#4cc58a;
  --warn:#f2c14e; --warn-bg:#3a2d0a; --warn-bar:#e5ae2b;
  --over:#ff8a7d; --over-bg:#3d1713; --over-bar:#f0685a;
  --hero-a:#2c46ad; --hero-b:#5238ad; --hero-shadow:rgba(0,0,0,.5);
  --cb-bg:#1f2a4d; --cb-fg:#a9bbff; --cv-bg:#2c2150; --cv-fg:#c6b0ff; --cg-bg:#12301f; --cg-fg:#6fdca5; --ca-bg:#3a2d0a; --ca-fg:#f2c14e;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15.5px/1.62 var(--font-body);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-top:16px;padding-bottom:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:700 1.3rem var(--font-display);letter-spacing:-.02em}
.chip{font-size:.78rem;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}
.tabs{display:flex;gap:5px;margin-top:14px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.tabs button{flex:1 1 0;min-width:0;background:none;border:0;padding:9px 4px;font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap;transition:background .14s,color .14s}
.tabs button:hover{color:var(--fg)}
@media (max-width:430px){.tabs{gap:2px}.tabs button{font-size:.78rem;padding:9px 2px}}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{padding-top:18px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px var(--shadow)}
.btn{font:600 .9rem var(--font-body);padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;transition:border-color .14s,background .14s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--over)}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder{color:var(--muted);opacity:.7}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.money{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.money input{width:5.5rem;text-align:right}
.note{padding:16px 18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.note.tip{background:var(--accent-soft);border-color:transparent}
.panel{padding:22px 20px;margin-top:16px}
.panel h2{font-size:1.12rem;margin-bottom:6px}
.panel .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.acts-row{display:flex;gap:10px;flex-wrap:wrap}

/* welcome */
.welcome{padding-top:max(32px,env(safe-area-inset-top,0px));max-width:640px;margin:0 auto}
.welcome h1{font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.15;margin-top:20px}
.welcome .lede{color:var(--muted);margin-top:10px;max-width:46ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:24px}
.choice{text-align:left;padding:22px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:block;transition:transform .14s,border-color .14s,box-shadow .14s}
.choice:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px var(--shadow)}
.choice h2{font-size:1.1rem}
.choice p{color:var(--muted);font-size:.9rem;margin-top:6px}
.welcome .foot{margin-top:22px;color:var(--muted);font-size:.88rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* hours tab */
.bar{padding:18px;display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;justify-content:space-between}
.bar .lbl{font-size:.85rem;color:var(--muted);margin-bottom:5px}
.bar .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.week{margin-top:14px;overflow:hidden}
.wk-head{display:block;width:100%;text-align:left;background:none;border:0;padding:18px 18px 16px;cursor:pointer;border-radius:18px}
.wk-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.wk-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wk-n{font:700 1.05rem var(--font-display)}
.wk-dates{color:var(--muted);font-size:.88rem}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.wk-stat{display:flex;align-items:center;gap:10px}
.wk-hrs{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-hrs b{color:var(--fg);font-size:1.05rem}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-ok .badge{background:var(--ok-bg);color:var(--ok)}
.s-warn .badge{background:var(--warn-bg);color:var(--warn)}
.s-over .badge{background:var(--over-bg);color:var(--over)}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 3px 3px 0;transition:transform .15s}
.wk-head[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:3px 3px 0 0}
.meter{display:block;height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok-bar);transition:width .2s}
.s-warn .meter i{background:var(--warn-bar)}
.s-over .meter i{background:var(--over-bar)}
.s-none .meter i{background:var(--line)}
.wk-body{padding:6px 18px 20px;border-top:1px solid var(--line)}
.namerow{display:flex;align-items:center;gap:10px;padding-top:16px;font-size:.85rem;color:var(--muted)}
.namerow input{flex:1;min-width:0}
.lim{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 0}
.js-left{font-weight:600;font-variant-numeric:tabular-nums}
.s-over .js-left{color:var(--over)}
.limctl{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.limctl input{width:6rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap;max-width:7.5rem;overflow:hidden;text-overflow:ellipsis}
td.day,th.day{text-align:left;position:sticky;left:0;z-index:1;white-space:nowrap}
td.day{background:var(--surface)}
.dn{font-weight:600;margin-right:6px}
.dd{color:var(--muted);font-size:.85rem}
.cw{display:flex;flex-direction:column;align-items:center;gap:4px}
.hin{width:100%;min-width:3.4rem;max-width:5rem;text-align:center;padding:8px 4px}
.hin.bad,.nin.bad{border-color:var(--over);background:var(--over-bg)}
.nin{width:100%;min-width:3.4rem;max-width:5rem;text-align:center;font-size:.76rem;padding:3px 4px}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.kv{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
.kv b{font:600 1.1rem var(--font-display);color:var(--fg);font-variant-numeric:tabular-nums}
.kv .money input{width:100%;max-width:7rem}
.empty{padding:28px 16px;color:var(--muted);font-size:.92rem;text-align:center}
.emptybox{display:flex;flex-direction:column;align-items:center;gap:12px}
.emptybox .mark{width:40px;height:40px}

/* tools (shift entry, screenshot) */
.tools{padding:18px;margin-top:16px}
.tools .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .hd .lead{font-weight:600;margin-right:auto}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.form input,.form select{font-size:.9rem}
.form .brk{width:5.5rem}
.shotrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.shotrow.off .sr-body{opacity:.62}
.shotrow input[type=checkbox]{width:18px;height:18px;margin-top:8px;flex:none}
.sr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.sr-line{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.sr-times{display:inline-flex;align-items:center;gap:5px}
.shotrow input[type=date],.shotrow input[type=time]{font-size:.86rem;padding:5px 6px}
.shotrow select{font-size:.84rem;padding:5px 6px;max-width:11rem}
.sr-brk{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted)}
.shotrow .brk{width:3.4rem;font-size:.86rem;padding:5px 6px}
.sr-note{font-size:.78rem;color:var(--muted);line-height:1.4}
.shotrow .prev{margin-left:auto;font-size:.88rem;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.shotrow .prev.badrow{color:var(--over)}
.oktag{font-size:.72rem;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:3px 9px;white-space:nowrap}
.hastag{font-size:.72rem;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:3px 9px}
.replrow{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:.85rem;color:var(--muted);line-height:1.4}
.replrow input{margin-top:3px;width:16px;height:16px;flex:none}
.busy{color:var(--muted);font-size:.9rem;margin-top:12px}

/* earnings */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:18px}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font:700 1.4rem var(--font-display);margin-top:2px;font-variant-numeric:tabular-nums}
.dt{overflow-x:auto}
.dt table th,.dt table td{text-align:right}
.dt table th:first-child,.dt table td:first-child{text-align:left}
.dt td{padding:9px 8px}
.dt .arch{font-size:.75rem;color:var(--muted);margin-left:6px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}

/* jobs */
.jobcard{padding:16px 0;border-top:1px solid var(--line)}
.jobcard:first-of-type{border-top:0;padding-top:0}
.jobrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jobrow .nm{flex:1 1 170px}
.jobrow .acts{display:flex;gap:6px;margin-left:auto}
.jobopts{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-left:10px;border-left:2px solid var(--line)}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:.85rem;color:var(--muted)}
.opt .ol{font-weight:600;color:var(--fg);min-width:6.2rem}
.opt input[type=time]{padding:5px 6px;font-size:.88rem}
.opt input.n3{width:4.2rem;text-align:right;padding:5px 6px;font-size:.88rem}
.jobcard{padding:18px 0}
.jobrow .money input{width:5.2rem}
.jstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.jstats>div{background:var(--surface-2);border-radius:12px;padding:10px 10px 9px;min-width:0;position:relative;overflow:hidden}
.jstats>div:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--jc)}
.jstats b{display:block;font:700 1.08rem var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jstats>div>span{display:block;font-size:.72rem;color:var(--muted);line-height:1.25;margin-top:2px}
.jspark{display:flex;flex-direction:column;justify-content:flex-end}
.spark{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:2px}
.spark i{display:block;flex:1;border-radius:3px 3px 1px 1px;opacity:.85;min-height:2px}
.jspark .spark{margin-bottom:4px}
.jlast{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.jrules{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.jrules:hover{border-color:var(--jc)}
.jrules .jrt{font-weight:600;font-size:.86rem;flex:none}
.jrules .jrc{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.jrules svg{flex:none;color:var(--muted);transition:transform .2s}
.jrules[aria-expanded=true] svg{transform:rotate(180deg)}
.rchip{font-size:.72rem;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:3px 9px;white-space:nowrap}
.jobopts{margin-top:12px;gap:12px}
.optnote{font-size:.8rem;color:var(--muted);margin:-4px 0 0;line-height:1.45}
.jacts{margin-top:4px}
.conved{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.conved p{margin:0}
.conved textarea{min-height:9rem;font:.86rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.conv-photo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conv-photo input{flex:1 1 180px;min-width:0}
.warnline{color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 9px;margin-top:6px}
.jmix .jmixtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jmixbig{font:700 1.9rem var(--font-display);letter-spacing:-.02em;margin:2px 0}
.mixbar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;margin:14px 0 10px}
.mixbar i{min-width:6px}
.mixleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
@media (max-width:560px){.jstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.addjob{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.addjob .nm{flex:1 1 170px}
.addjob .acts{margin-left:auto}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.settings-row:first-of-type{border-top:0}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
textarea.plain{font:14px/1.4 var(--font-body)}

/* calendar */
.calrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.calrow:first-of-type{border-top:0}
.calrow .d{font-weight:500;min-width:9.5rem;font-variant-numeric:tabular-nums}
.calrow .lb{color:var(--muted);font-size:.85rem}
.lc{font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lc.l40{background:var(--ok-bg);color:var(--ok)}

  var s=pd(startISO),cls=0,label=null;
  for(var k=0;k<7;k++){
    var ds=iso(addDays(s,k));
    if(k>=1&&k<=5&&isClassDay(ds))cls++;
    if(!label){var hit=c.noClass.find(function(r){return ds>=r.start&&ds<=r.end&&r.name});if(hit)label=hit.name}
  }
  return{limit:cls?20:40,classDays:cls,label:label};
}
function calOutlook(){
  var c=S.cal;if(!c||S.role!=='student')return null;
  var base=sow(new Date()),cur=calWeek(iso(base));
  if(!cur)return{lines:['Your calendar does not cover this week, so use the default limit for new weeks.'],cur:null};
  var lines=[];
  lines.push(cur.limit===20?'Classes are in session this week, so your limit is <strong>20 hrs</strong>.':'No classes this week, so you can work up to <strong>40 hrs</strong>.');
  var next=null;
  for(var i=1;i<=60;i++){
    var d=addDays(base,7*i),ci=calWeek(iso(d));
    if(!ci)break;
    if(ci.limit!==cur.limit){next={start:d,info:ci};break}
  }
  if(next){
    if(cur.limit===20){
      var last=null;
      for(var k=1;k<=14&&!last;k++){var dd=addDays(next.start,-k);if(isClassDay(iso(dd)))last=dd}
      lines.push((last?'Your term (finals included) ends <strong>'+mdy.format(last)+'</strong>. ':'')+'From <strong>'+mdy.format(next.start)+'</strong> you can work up to 40 hrs a week.');
    }else{
      var first=null;
      for(var k2=0;k2<=14&&!first;k2++){var d2=addDays(next.start,k2);if(isClassDay(iso(d2)))first=d2}
      lines.push((first?'Classes resume <strong>'+mdy.format(first)+'</strong>. ':'')+'From the week of <strong>'+mdy.format(next.start)+'</strong> you are back to 20 hrs.');
    }

}

/* clock in / out -> paid hours and night hours */
function toMin(s){var p=String(s||'').split(':');return (+p[0])*60+(+p[1]||0)}
function shiftCalc(inS,outS,jb,brk){
  if(!TIME_RE.test(inS||'')||!TIME_RE.test(outS||''))return null;
  var a=toMin(inS),b=toMin(outS);
  var len=b-a;if(len<=0)len+=1440;
  var night=0;
  if(jb.nightRate>0){
    var ns=toMin(jb.nightStart||'22:00'),ne=toMin(jb.nightEnd||'06:00');
    for(var k=-1;k<=2;k++){
      var s=ns+1440*k,e=ne+1440*k;if(e<=s)e+=1440;
      var lo=Math.max(a,s),hi=Math.min(a+len,e);if(hi>lo)night+=hi-lo;
    }
  }
  var explicit=(brk!==''&&brk!=null&&isFinite(+brk));
  var bm=explicit?+brk:(jb.breakMin||0);
  var day=len-night;
  if(bm>0&&(explicit||len/60>(jb.breakAfter||0))){
    day-=bm;
    if(day<0){night=Math.max(0,night+day);day=0}
  }
  var paid=minsToHrs(jb,day+night);
  return{paid:paid,night:night>0?Math.min(paid,minsToHrs(jb,night)):0,len:r2(len/60),mins:day+night};
}

/* ---------- week mutations ---------- */
function newWeek(start){
  var s=iso(start),ci=(S.role==='student'&&S.cal)?calWeek(s):null;
  return{id:uid(),start:s,name:(ci&&ci.label)||'',limit:defaultLimit(s),
    jobIds:S.jobs.filter(function(j){return !j.archived}).map(function(j){return j.id}),hours:{},night:{},tips:0};
}
/* Adds the week containing any date, past or future, without filling the gap between. */
function addWeekAt(startISO){
  var w=S.weeks.find(function(x){return x.start===startISO});
  if(w){open=new Set([w.id]);openM.add(monthKeyOfWeek(w));return w}
  w=newWeek(pd(startISO));
  var i=0;while(i<S.weeks.length&&S.weeks[i].start<startISO)i++;
  S.weeks.splice(i,0,w);open=new Set([w.id]);openM.add(monthKeyOfWeek(w));
  return w;
}
function thisWeek(){return iso(sow(new Date()))}
function addNextWeek(){
  var last=S.weeks[S.weeks.length-1];
  return addWeekAt(last?iso(addDays(pd(last.start),7)):thisWeek());
}
function ensureWeek(ds){return addWeekAt(iso(sow(pd(ds))))}
function addToCell(ds,jobId,hrs,nightHrs){
  var w=ensureWeek(ds);if(!w)return null;
  if(w.jobIds.indexOf(jobId)<0)w.jobIds.push(jobId);
  var day=w.hours[ds]=w.hours[ds]||{};
  day[jobId]=r2((day[jobId]||0)+hrs);
  if(nightHrs>0){var nd=w.night[ds]=w.night[ds]||{};nd[jobId]=r2((nd[jobId]||0)+nightHrs)}
  open=new Set([w.id]);
  return w;
}
function addJobToCurrentAndFuture(id){
  var cur=iso(sow(new Date()));
  S.weeks.forEach(function(w){if(w.start>=cur&&w.jobIds.indexOf(id)<0)w.jobIds.push(id)});
}

  var i=Math.min(ui.tourStep,TOUR.length-1),step=TOUR[i];

    if(r0.top<60||r0.bottom>innerHeight-60){try{el.scrollIntoView({block:'center'})}catch(e){}r0=el.getBoundingClientRect()}

    var topPx=r.bottom+pad+12;

  }
  setTimeout(function(){tourBusy=false},0);
}

/* how each job is doing: this month, average day, last 8 weeks */
function jobStats(j){
  var T=today(),mk=T.getFullYear()+'-'+String(T.getMonth()+1).padStart(2,'0');
  var since=iso(addDays(T,-60)),st={mHrs:0,mPay:0,allHrs:0,allPay:0,days:0,recentHrs:0,last:null,spark:[]};
  var w0=sow(T),wk={};
  for(var i=7;i>=0;i--)wk[iso(addDays(w0,-7*i))]=0;
  S.weeks.forEach(function(w){
    for(var ds in w.hours){
      var h=w.hours[ds][j.id];if(!(h>0))continue;
      var nt=(w.night[ds]&&w.night[ds][j.id])||0,p=jobPay(j,h,nt);
      st.allHrs+=h;st.allPay+=p;
      if(ds.slice(0,7)===mk){st.mHrs+=h;st.mPay+=p}
      if(ds>=since&&ds<=iso(T)){st.days++;st.recentHrs+=h}
      if(!st.last||ds>st.last)st.last=ds;
      var ws=iso(sow(pd(ds)));if(ws in wk)wk[ws]+=h;
    }
  });
  st.spark=Object.keys(wk).sort().map(function(k){return wk[k]});
  st.avg=st.days?st.recentHrs/st.days:0;
  return st;
}

/* ---------- reading text: dates, shift times, school calendars (used when no AI is available) ---------- */
var MON3=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
var MONTHL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function validDate(y,m,d){var x=new Date(y,m,d);return (x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d)?x:null}
/* a date with no year is the most recent one that is not more than a week ahead */
function yearFor(m,d){var T=today(),y=T.getFullYear();if(new Date(y,m,d||1)>addDays(T,7))y--;return y}
/* a calendar date with no year: the closest year to today (calendars look ahead) */
function calYear(m,d,hint){
  if(hint)return hint;
  var T=today(),y=T.getFullYear(),best=y,bd=1e15;
  [y-1,y,y+1].forEach(function(c){var dd=Math.abs(new Date(c,m,d)-T-60*864e5);if(dd<bd){bd=dd;best=c}});
  return best;
}
function fixYear(s){s=+s;return s<100?2000+s:s}

/* all the dates written on one line of text */
function lineDates(line,yearOf){
  yearOf=yearOf||yearFor;
  var out=[],m,re;
  re=/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/g;
  while((m=re.exec(line))){var a=validDate(+m[1],+m[2]-1,+m[3]);if(a)out.push({d:a,i:m.index,len:m[0].length,y:true})}
  re=/(^|[^\d:.])(\d{1,2})\/(\d{1,2})(?:\/(\d{4}|\d{2}))?(?![\d:])/g;
  while((m=re.exec(line))){var mo=+m[2]-1,da=+m[3],b=validDate(m[4]?fixYear(m[4]):yearOf(mo,da),mo,da);if(b)out.push({d:b,i:m.index+m[1].length,len:m[0].length-m[1].length,y:!!m[4]})}
  re=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b(?![:.]\d)(?:,?\s+(20\d\d))?/gi;
  while((m=re.exec(line))){var mi=MON3.indexOf(m[1].toLowerCase()),c=validDate(m[3]?+m[3]:yearOf(mi,+m[2]),mi,+m[2]);if(c)out.push({d:c,i:m.index,len:m[0].length,y:!!m[3]})}
  re=/\b(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:,?\s+(20\d\d))?\b/gi;
  while((m=re.exec(line))){var mi2=MON3.indexOf(m[2].toLowerCase()),e=validDate(m[3]?+m[3]:yearOf(mi2,+m[1]),mi2,+m[1]);if(e)out.push({d:e,i:m.index,len:m[0].length,y:!!m[3]})}
  out.sort(function(a,b){return a.i-b.i});
  return out;
}

/* clock times on one line; drops plain numbers, pay and durations */
function cleanOcrLine(s){
  return String(s||'')
    .replace(/[|]/g,' ')
    .replace(/(\d)\s*[;]\s*(\d)/g,'$1:$2')
    .replace(/(\d)\s*:\s*([0-9oO])([0-9oO])/g,function(_,a,b,c){return a+':'+b.replace(/o/i,'0')+c.replace(/o/i,'0')})
    .replace(/\b[lI](\d:\d\d)/g,'1$1')
    .replace(/(\d:\d\d)\s?([AaPp])\s?[MmNnHh]\b/g,'$1 $2M')
    .replace(/(^|[^\d:\/.$])(\d{1,2})(\s*(?:[-–—~=]|to|until|till)\s*\d{1,2}(?::\d\d)?\s?[AaPp])/g,function(m,a,h,r,off,str){
      return /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*$/i.test(str.slice(0,off)+a)?m:a+h+':00'+r})
    .replace(/\s+/g,' ').trim();
}
function lineTimes(line){
  var out=[],re=/(^|[^0-9:\/$])(\d{1,2})(?::([0-5]\d))?(\s*([ap])(?:\.?\s?m\b\.?|\b))?/gi,m;
  while((m=re.exec(line))){
    var hh=+m[2],mm=m[3]!=null?+m[3]:null,ap=m[5]?m[5].toLowerCase():null;
    if(mm==null&&!ap)continue;
    var rest=line.slice(re.lastIndex);
    if(!ap&&/^\s*(hrs?\b|hours|h\b|min)/i.test(rest))continue;
    if(/^[.,]\d/.test(rest))continue;
    if(ap){if(hh<1||hh>12)continue;hh=hh%12+(ap==='p'?12:0)}
    else if(hh>23)continue;
    out.push({h:hh,m:mm||0,ap:!!ap,i:m.index+m[1].length});
  }
  if(out.some(function(t){return t.ap}))out=out.filter(function(t){return t.ap});
  return out;
}
function hm(t){return String(t.h).padStart(2,'0')+':'+String(t.m).padStart(2,'0')}

/* every time-looking token on a line: clock times (with or without am/pm) and H:MM durations */
function timeTokens(line){
  var out=[],re=/(^|[^0-9:\/$.])(\d{1,2})(?::([0-5]\d))?(?:\s?([ap])(?:\.?\s?m\.?)?(?![a-z]))?/gi,m;
  while((m=re.exec(line))){
    var h=+m[2],mm=m[3]!=null?+m[3]:null,ap=m[4]?m[4].toLowerCase():null,start=m.index+m[1].length;
    if(mm==null&&!ap)continue;
    if(mm==null&&/\s[ap]/i.test(m[0]))continue;
    var rest=line.slice(re.lastIndex);
    if(/^[.,]\d/.test(rest)||/^\/\d/.test(rest))continue;
    if(ap&&(h<1||h>12))continue;
    if(!ap&&h>23&&mm==null)continue;
    out.push({h:h,m:mm||0,ap:ap,i:start,end:re.lastIndex,unit:!ap&&/^\s*(hrs?\b|hours|h\b)/i.test(rest)});
  }
  return out;
}
/* the minutes after midnight a token could mean */
function tokMins(t,ampmDoc){
  if(t.ap)return[(t.h%12+(t.ap==='p'?12:0))*60+t.m];
  if(t.h>12||t.h===0||!ampmDoc)return t.h<24?[t.h*60+t.m]:[];
  return t.h===12?[12*60+t.m,t.m]:[t.h*60+t.m,(t.h+12)*60+t.m];
}
function minHM(n){n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
var DAYMS=864e5;
/* a shift total read off the screen: H:MM is exact, 5.73 hours is good to about half a minute */
function near(h,d){return Math.abs(h-d)<=(Math.abs(h-Math.round(h))>0.05?0.7:2)}
function dayNo(d){return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/DAYMS)}

/* turns the text of a timeclock screenshot into shifts.
   Handles: one row per shift (in and out on one line), punches on separate lines (each with or without its own date),
   meal punches, open shifts (still clocked in), and checks each shift against the shift total shown on screen. */
function parseShiftText(text){
  var raw=String(text||'').split(/\r?\n/).map(cleanOcrLine).filter(Boolean);
  raw=mendLines(raw);
  var WDN=['sun','mon','tue','wed','thu','fri','sat'];
  /* 03/11 can mean March 11 or 3 November: the weekday printed beside it, or a 13/11 elsewhere, decides */
  var mdV=0,dmV=0,dmDoc=false,hardDM=0,hardMD=0,wdN=0;
  function swapDM(line,x){
    var m=/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(line.substr(x.i,x.len));if(!m)return null;
    var mo=+m[2]-1,da=+m[1],y=m[3]?fixYear(m[3]):yearFor(mo,da);

  raw.forEach(function(l){

function guideMatch(q){
  for(var i=0;i<GUIDE.length;i++){
    var g=GUIDE[i];
    if(g.re.test(q))return bot(g.a,g.go?[{label:'Show me',go:g.go}]:(g.run?[{label:'Start the tour',run:g.run}]:null));
  }
  return null;
}

function answerLocal(q0){
  var q=' '+String(q0).toLowerCase().replace(/[‘’]/g,"'").replace(/[?!,;]+/g,' ').replace(/\.(?!\d)/g,' ').replace(/\s+/g,' ')+' ';
  if(/^\s*(hi|hey|hello|yo|help|what can you do|what do you do|who are you)\s*$/.test(q))return introMsg();
  var how=/\b(how (do|can|to|would|should|does)|where|can i|is there a way|i want to|i need to|help me|explain)\b/.test(q)&&!/\bhow (much|many|long)\b/.test(q);
  if(how){var g=guideMatch(q);if(g)return g}
  var want={pay:/(earn|made\b|make\b|making|money|paid|\bpay\b|income|wages?|salary|dollars|cash|\$)/.test(q),
    hrs:/\b(hours?|hrs|worked|shifts?|how long)\b/.test(q),tips:/\btips?\b/.test(q)};
  var data=want.pay||want.hrs||want.tips||/\b(how (much|many)|busiest|most|least|average|avg|left|remaining|over|limit|total)\b/.test(q);
  if(data){
    if(!S.weeks.length)return bot('You haven’t logged any weeks yet. Tap <b>Add week</b> or <b>Log shift</b> on the Hours page to start.',[{label:'Show me',go:{tab:'hours',sel:'.qa'}}]);
    if(/\b(left|remaining|how many more|can i (still )?work|more hours|over (my|the) limit|under (my|the) limit|near (my|the) limit|until (my|the) limit|my limit)\b/.test(q)&&!/\b(change|set|edit)\b/.test(q))return limitAnswer(q);
    var jb=matchJob(q);
    var dir=/\b(most|highest|best|busiest|biggest|max|maximum|top)\b/.test(q)?'max':/\b(least|lowest|fewest|slowest|worst|min|minimum|lightest)\b/.test(q)?'min':null;
    if(dir)return superAnswer(q,dir,want.pay&&!want.hrs?'pay':'hrs');
    if(/\b(average|avg|typical|typically|usually|per week|a week|each week)\b/.test(q))return avgAnswer(q,jb);
    var rg=parseRange(q);
    if(!rg&&(want.pay||want.hrs||want.tips||/\btotal\b/.test(q)))rg=ALLTIME;
    if(rg)return rangeAnswer(rg,jb,want);
  }
  return guideMatch(q);
}

function compactIcs(t){
  if(t.indexOf('BEGIN:VEVENT')<0)return t;
  var L=t.replace(/\r?\n[ \t]/g,'').split(/\r?\n/),out=[],ev=null;
  function d(v){var m=/(\d{4})(\d{2})(\d{2})/.exec(v||'');return m?m[1]+'-'+m[2]+'-'+m[3]:''}
  L.forEach(function(l){
    l=l.replace(/\r$/,'');
    if(l==='BEGIN:VEVENT')ev={};
    else if(l==='END:VEVENT'){
      if(ev&&ev.s&&ev.t){
        var e=ev.e?d(ev.e):'';
        if(e&&/^\d{8}$/.test(ev.e))e=iso(addDays(pd(e),-1));
        out.push(ev.s+(e&&e>ev.s?' to '+e:'')+': '+ev.t);
      }
      ev=null;
    }else if(ev){
      var c=l.indexOf(':');if(c<0)return;
      var k=l.slice(0,c).split(';')[0],v=l.slice(c+1);
      if(k==='DTSTART')ev.s=d(v);else if(k==='DTEND')ev.e=v;else if(k==='SUMMARY')ev.t=v.replace(/\\,/g,',').replace(/\\n/g,' ');
    }
  });
  return out.join('\n');
}

      var c=shiftCalc(f.in,f.out,jb,f.brk);
      if(!c){toast('Enter both a clock in and a clock out time.');break}
      if(c.paid<=0){toast('That shift has no paid time after the break.');break}
      var sw=addToCell(f.date,jb.id,c.paid,c.night);ui.shift.in='';ui.shift.out='';ui.shift.brk='';
      save();render();if(sw)flash(root.querySelector('.week[data-w="'+sw.id+'"]'));
      toast('Added '+hrsT(c.paid)+''+(c.night>0?' ('+hrsT(c.night)+' night)':'')+' to '+mdy.format(pd(f.date))+', '+jname(jb)+'.');
      break;}
    case 'read-shot':readShot();break;
    case 'clear-shots':ui.shot.rows=null;ui.shot.notes='';ui.shot.err='';ui.shot.files=[];render();break;
    case 'add-shots':{
      var added=0,hrs=0,skipped=0,cleared={},rd=0;
      if(!job(ui.shot.job)||!ui.shot.rows)break;
      S.jobAlias=S.jobAlias||{};
      ui.shot.rows.forEach(function(r){
        if(!r.use)return;
        var jb2=job(r.job||ui.shot.job);if(!jb2){skipped++;return}
        var cc=shiftCalc(r.in,r.out,jb2,r.brk);
        if(!cc||cc.paid<=0||!validShotDate(r.date)){skipped++;return}
        var ck=r.date+'|'+jb2.id;
        if(ui.shot.replace&&!cleared[ck]){if(cellHrs(r.date,jb2.id)>0)rd++;clearCell(r.date,jb2.id);cleared[ck]=1}
        addToCell(r.date,jb2.id,cc.paid,cc.night);added++;hrs+=cc.paid;
        var lk=labelKey(r.label);if(lk&&activeJobs().length>1)S.jobAlias[lk]=jb2.id;
      });
      if(!added){toast('Nothing to add. Check the dates and times.');break}
      ui.shot.rows=null;ui.shot.notes='';ui.shot.files=[];ui.panel=null;
      save();render();
      toast('Added '+added+' shift'+(added===1?'':'s')+' ('+hrsT(hrs)+')'+(rd?', replacing the old hours on '+rd+' day'+(rd===1?'':'s'):'')+(skipped?', skipped '+skipped:'')+'.');
      break;}
    case 'use-sdsu':S.cal=normCal(JSON.parse(JSON.stringify(SDSU)));save();render();toast('San Diego State calendar added.');break;
    case 'remove-cal':armed(b,'Tap again to remove',function(){S.cal=null;save();render();toast('Calendar removed. Existing weeks keep their limits.')});break;
    case 'apply-cal':
      armed(b,'Tap again to apply',function(){
        var ch=0,nm=0;
        S.weeks.forEach(function(w){
          var ci=calWeek(w.start);if(!ci)return;
          if(w.limit!==ci.limit){w.limit=ci.limit;ch++}
          if(!(w.name||'').trim()&&ci.label){w.name=ci.label;nm++}
        });
        save();render();toast('Updated '+ch+' limit'+(ch===1?'':'s')+' and named '+nm+' week'+(nm===1?'':'s')+'.');
      });break;
    case 'read-cal':readCal();break;
    case 'auth-mode':ui.auth.mode=v;ui.auth.err='';ui.auth.info='';render();break;
    case 'sign-out':signOut();break;
    case 'caution-ok':ui.cautionOff=true;render();break;
    case 'use-cal':if(ui.calIn.result){S.cal=ui.calIn.result;ui.calIn={text:'',file:null,busy:false,result:null,err:''};save();render();toast('Calendar added.')}break;
    case 'discard-cal':ui.calIn.result=null;ui.calIn.err='';render();break;
    case 'add-job':{
      var nm2=document.getElementById('nj-name'),wg=document.getElementById('nj-wage');
      var name=nm2.value.trim();
      if(!name){toast('Give the job a title first.');nm2.focus();break}
      var j=mkJob(name.slice(0,60),Math.max(0,parseFloat(wg.value)||0),false);
      S.jobs.push(j);addJobToCurrentAndFuture(j.id);save();render();
      toast('Added '+j.name+'.');
      break;}
    case 'job-rules':{var oid=b.dataset.id;ui.jobOpen[oid]=!ui.jobOpen[oid];if(!ui.jobOpen[oid]&&ui.conv.job===oid)ui.conv.job=null;render();break}
    case 'conv-mode':{
      var cj=job(b.dataset.id);if(!cj)break;
      if(v==='exact'){if(cj.conv)cj.conv.on=false;if(ui.conv.job===cj.id)ui.conv.job=null;save();render();toast(jname(cj)+' uses normal minute math.');break}
      if(cj.conv&&cj.conv.rows.length){cj.conv.on=true;save();render();toast(jname(cj)+' uses '+cj.conv.name+'.');break}
      ui.conv={job:cj.id,text:'',busy:false,prog:''};render();
      var ta=document.getElementById('conv-text');if(ta)ta.focus();
      break;}
    case 'conv-edit':{var ej=job(b.dataset.id);if(!ej)break;ui.conv={job:ej.id,text:ej.conv?convText(ej.conv.rows):'',busy:false,prog:''};render();break}
    case 'conv-preset':{var pr=CONV_PRESETS[v];if(!pr)break;ui.conv.text=convText(pr.rows);ui.conv.preset=v;render();break}
    case 'conv-cancel':ui.conv={job:null,text:'',busy:false,prog:''};render();break;
    case 'conv-save':{
      var sj=job(b.dataset.id),pc=parseConvText(ui.conv.text);if(!sj||!pc.ok)break;
      var pre=ui.conv.preset&&CONV_PRESETS[ui.conv.preset]&&convText(CONV_PRESETS[ui.conv.preset].rows)===convText(pc.rows)?CONV_PRESETS[ui.conv.preset].name:'Timesheet chart';
      sj.conv={on:true,name:pre,rows:pc.rows};ui.conv={job:null,text:'',busy:false,prog:''};save();render();
      toast(jname(sj)+' now uses its chart. 3h 5m = '+decTxt(minsToHrs(sj,185))+' hrs.');
      break;}
    case 'conv-read':{
      var fi=document.getElementById('conv-file'),cf2=fi&&fi.files&&fi.files[0];
      if(!cf2){toast('Pick a photo of the chart first.');break}
      ui.conv.busy=true;ui.conv.prog='Reading...';render();
      var cprog=function(m){ui.conv.prog=m;var bt=root.querySelector('[data-action="conv-read"]');if(bt)bt.textContent=m};
      ocrFiles([cf2],cprog).then(function(t){
        var p1=parseConvText(t[0]||'');
        if(p1.ok&&p1.covered>=55)return{raw:t[0],p:p1};
        return ocrFiles([cf2],cprog,{lines:true,psm:'6',again:true}).then(function(t2){var p2=parseConvText(t2[0]||'');return (p2.ok&&(!p1.ok||p2.covered>p1.covered))?{raw:t2[0],p:p2}:{raw:t[0],p:p1}},function(){return{raw:t[0],p:p1}});
      }).then(function(res){
        var raw=(res.raw||''),pc2=res.p;
        ui.conv.busy=false;ui.conv.text=pc2.ok?convText(pc2.rows):raw.trim();ui.conv.preset=null;render();
        toast(pc2.ok?(pc2.issues.length?'Read the chart. '+pc2.issues[0]:'Read the chart: all 60 minutes. Check it, then tap Use this chart.'):'Could not make out a chart. Fix the text or type it in.');
      }).catch(function(){ui.conv.busy=false;render();toast('Could not read that photo. Try a sharper one, or type the chart.')});
      break;}
    case 'archive-job':{
      var jb3=job(b.dataset.id);if(!jb3)break;
      jb3.archived=!jb3.archived;
      if(!jb3.archived)addJobToCurrentAndFuture(jb3.id);
      save();render();break;}
    case 'delete-job':
      armed(b,'Tap again to delete',function(){
        var id=b.dataset.id;
        S.jobs=S.jobs.filter(function(j){return j.id!==id});
        S.weeks.forEach(function(w){
          w.jobIds=w.jobIds.filter(function(j){return j!==id});
          for(var d in w.hours){delete w.hours[d][id];if(!Object.keys(w.hours[d]).length)delete w.hours[d]}
          for(var d2 in w.night){delete w.night[d2][id];if(!Object.keys(w.night[d2]).length)delete w.night[d2]}
        });
        save();render();toast('Job and its hours deleted.');
      });break;
    case 'copy-backup':{
      var txt=JSON.stringify(S);
      copyText(txt).then(function(ok){
        if(ok)toast('Backup copied.');
        else{var ta=document.getElementById('bk');if(ta){ta.value=txt;ta.select()}toast('Copy it from the box below.')}
      });break;}
    case 'csv':{
      var csv=csvText();
      if(DL){
        DL.save({filename:'shiftly-hours.csv',data:csv}).then(function(){toast('CSV saved.')}).catch(function(err){
          if(!err||err.code!=='declined')toast('Could not save a file here. Use Copy backup instead.');
        });
      }else{copyText(csv).then(function(ok){toast(ok?'CSV copied.':'Could not copy the CSV here.')})}
      break;}
    case 'restore':
      armed(b,'Tap again to replace data',function(){
        var ta=document.getElementById('bk');
        try{
          var o=JSON.parse(ta.value);
          if(!o||!Array.isArray(o.jobs)||!Array.isArray(o.weeks))throw new Error('shape');
          S=normalize(o);initOpen();flush();render();toast('Backup restored.');
        }catch(err){toast('That text is not a valid backup.')}
      });break;
    case 'reset':
      armed(b,'Tap again to erase',function(){chat.msgs=[];S=blank();tab='hours';ui.panel=null;initOpen();flush();render();toast('All data erased.')});break;
  }
});

function updateShotPrev(i){
  var r=ui.shot.rows&&ui.shot.rows[i],jb=r&&job(r.job||ui.shot.job),el=root.querySelector('[data-prev="'+i+'"]');
  if(!r||!el)return;
  var c=jb?shiftCalc(r.in,r.out,jb,r.brk):null,ok=c&&validShotDate(r.date);
  el.textContent=prevText(c,ok);el.classList.toggle('badrow',!ok);
}
root.addEventListener('input',function(e){
  var t=e.target,w;
  if(t.classList.contains('hin')){
    w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    var d=t.dataset.d,j=t.dataset.j,v=parseHrs(t.value);if(v>0)v=/[:hm]/i.test(t.value)?minsToHrs(job(j),v*60):r2(v);
    if(v>0){(w.hours[d]=w.hours[d]||{})[j]=v}
    else{
      if(w.hours[d]){delete w.hours[d][j];if(!Object.keys(w.hours[d]).length)delete w.hours[d]}
      if(w.night[d]){delete w.night[d][j];if(!Object.keys(w.night[d]).length)delete w.night[d]}
      var ni=t.closest('td').querySelector('.nin');if(ni){ni.value='';ni.classList.remove('bad')}
    }
    t.classList.toggle('bad',v>24);
    var nin=t.closest('td').querySelector('.nin');
    if(nin){var nv0=(w.night[d]&&w.night[d][j])||0;nin.classList.toggle('bad',nv0>(v>0?v:0))}
    save();refreshWeek(w.id);
  }else if(t.classList.contains('nin')){
    w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    var nd=t.dataset.d,nj=t.dataset.j,nv=parseHrs(t.value);if(nv>0)nv=r2(nv);
    if(nv>0){(w.night[nd]=w.night[nd]||{})[nj]=nv}
    else if(w.night[nd]){delete w.night[nd][nj];if(!Object.keys(w.night[nd]).length)delete w.night[nd]}
    var hv=(w.hours[nd]&&w.hours[nd][nj])||0;
    t.classList.toggle('bad',nv>hv);
    save();refreshWeek(w.id);
  }else if(t.classList.contains('tips')){
    w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    w.tips=Math.max(0,parseFloat(t.value)||0);save();refreshWeek(w.id);
  }else if(t.classList.contains('wk-name')){
    w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    w.name=t.value.slice(0,60);save();refreshWeekName(w);
  }else if(t.classList.contains('lim-in')){
    w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    var lv=parseFloat(t.value);w.limit=lv>0?lv:null;save();refreshWeek(w.id);
  }else if(t.dataset.job){
    var jb=job(t.dataset.job);if(!jb)return;
    var f=t.dataset.field;
    if(f==='name')jb.name=t.value;
    else if(f==='nightStart'||f==='nightEnd'){if(TIME_RE.test(t.value))jb[f]=t.value}
    else jb[f]=Math.max(0,parseFloat(t.value)||0);
    save();
  }else if(t.dataset.sr){
    var r=ui.shot.rows&&ui.shot.rows[+t.dataset.i];if(!r)return;
    var fld=t.dataset.sr;
    if(fld==='use'||fld==='job')return;
    r[fld]=t.value;
    updateShotPrev(+t.dataset.i);
  }else if(t.id==='wk-pick')ui.pick=t.value;
  else if(t.id==='sf-date')ui.shift.date=t.value;
  else if(t.id==='sf-in')ui.shift.in=t.value;
  else if(t.id==='sf-out')ui.shift.out=t.value;
  else if(t.id==='sf-brk')ui.shift.brk=t.value;
  else if(t.id==='cal-text')ui.calIn.text=t.value;
  else if(t.id==='conv-text'){
    ui.conv.text=t.value;ui.conv.preset=ui.conv.preset&&CONV_PRESETS[ui.conv.preset]&&convText(CONV_PRESETS[ui.conv.preset].rows)===t.value?ui.conv.preset:null;
    var cj2=job(ui.conv.job),pp=parseConvText(t.value),pv=document.getElementById('conv-prev');
    if(pv)pv.innerHTML=convPrevHTML(pp,{conv:{on:true,rows:pp.ok?pp.rows:[]}});
    var sv=root.querySelector('[data-action="conv-save"]');if(sv)sv.disabled=!pp.ok;
  }
  else if(t.id==='customLimit'){
    var cv=parseFloat(t.value);S.customLimit=cv>0?cv:null;save();
    var chip=root.querySelector('.chip');if(chip)chip.textContent=chipText();
  }
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList.contains('lim-sel')){
    var w=S.weeks.find(function(x){return x.id===t.dataset.w});if(!w)return;
    w.limit=t.value==='none'?null:parseFloat(t.value);save();refreshWeek(w.id);
  }else if(t.dataset.ui==='range'){
    ui.range=t.value;render();
  }else if(t.dataset.sr==='use'){
    var r=ui.shot.rows&&ui.shot.rows[+t.dataset.i];if(r)r.use=t.checked;
    var rw=t.closest('.shotrow');if(rw)rw.classList.toggle('off',!t.checked);
  }else if(t.dataset.sr==='job'){
    var rj=ui.shot.rows&&ui.shot.rows[+t.dataset.i];if(rj){rj.job=t.value;render()}
  }else if(t.id==='shot-replace'){
    ui.shot.replace=t.checked;
  }else if(t.id==='sf-job'){
    ui.shift.job=t.value;render();
  }else if(t.id==='shot-job'){
    ui.shot.job=t.value;if(ui.shot.rows)render();
  }else if(t.id==='shot-file'){
    var fl=Array.prototype.slice.call(t.files||[]);
    if(fl.length>12){toast('Pick up to 12 screenshots at a time.');fl=fl.slice(0,12)}
    ui.shot.files=fl;render();
  }else if(t.id==='cal-file'){
    var cf=t.files&&t.files[0]||null;ui.calIn.file=null;
    if(cf){
      if(/^image\//.test(cf.type))ui.calIn.file=cf;
      else if(/\.(ics|txt)$/i.test(cf.name)||/^text\//.test(cf.type)){
        var rd=new FileReader();
        rd.onload=function(){ui.calIn.text=compactIcs(String(rd.result||'')).slice(0,20000);ui.calIn.err='';render();toast('File loaded. Tap Read calendar to continue.')};
        rd.onerror=function(){toast('Could not read that file.')};
        rd.readAsText(cf);
      }else{t.value='';toast('Use a screenshot, an .ics file or a .txt file. For a PDF, take a screenshot of the page.')}
    }
  }
});

if(window.__SC_TEST)window.__SC_TEST({shiftCalc:shiftCalc,calWeek:calWeek,calOutlook:calOutlook,setCal:function(c){S.cal=normCal(c)},SDSU:SDSU,normalize:normalize,mkJob:mkJob,jobPay:jobPay,totals:totals,nightTotals:nightTotals,wagesOf:wagesOf,addToCell:addToCell,ensureWeek:ensureWeek,addWeekAt:addWeekAt,tourStep:tourStep,tourFinish:tourFinish,TOUR:TOUR,markDuplicateShots:markDuplicateShots,state:function(){return S},setState:function(s){S=s},csvText:csvText,weekHTML:weekHTML,hoursView:hoursView,calendarView:calendarView,jobsView:jobsView,earningsView:earningsView,settingsView:settingsView,welcomeHTML:welcomeHTML,answerLocal:answerLocal,parseRange:parseRange,parseShiftText:parseShiftText,parseConvText:parseConvText,minsToHrs:minsToHrs,fmt:fmt,hrsT:hrsT,parseHrs:parseHrs,gridText:gridText,verifyTotal:verifyTotal,jobForLabel:jobForLabel,cleanLabel:cleanLabel,cellHrs:cellHrs,parseCalText:parseCalText,lineTimes:lineTimes,lineDates:lineDates,rangeStats:rangeStats,monthKeyOfWeek:monthKeyOfWeek,heroHTML:heroHTML,weeksHTML:weeksHTML,normCal:normCal,cloudCall:cloudCall,CLOUD:CLOUD});

if(sb){
  render();
  sb.auth.getSession().then(function(r){
    var ses=r&&r.data&&r.data.session;
    if(ses&&ses.user)onSignedIn(ses.user);else{booting=false;render()}
  },function(){booting=false;render()});
}else render();
})();
</script>
